[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "1.0.0"
description = "Production-grade hybrid RAG: ingestion, retrieval, re-ranking, and grounded answer generation."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "llama-index==0.10.68",
    "llama-index-readers-file==0.1.33",
    "llama-index-core==0.10.68",
    "chromadb==0.5.23",
    "rank-bm25==0.2.2",
    "sentence-transformers==3.3.1",
    "python-docx==1.1.2",
    "trafilatura==1.12.0",
    "beautifulsoup4==4.12.3",
    "requests==2.32.3",
    "httpx==0.27.2",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.0.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "loguru==0.7.2",
    "prometheus-client==0.21.1",
    "tqdm==4.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.4",
]

[tool.setuptools.packages.find]
include = ["app*", "ingestion*", "retrieval*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]
"scripts/*" = ["E501"]
"ingestion/parsers/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ollama'"
markers = [
    "ollama: requires a running Ollama server with models installed",
    "integration: requires external services",
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app", "ingestion", "retrieval"]
omit = ["*/tests/*", "*/scripts/*"]
